name: greenlight_stack

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      PGUSER: postgres
      PGPASSWORD: password
      PGDATABASE: greenlight
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data 
    ports:
      - '5432:5432'
    networks:
      - core
  redis:
    image: redis:bookworm
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    networks:
      - core

volumes:
  pgdata:

networks:
  core:
    driver: bridge
    name: greenlight_bridge